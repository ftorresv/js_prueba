<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de divisas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/style/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.min.js"
      integrity="sha512-L0Shl7nXXzIlBSUUPpxrokqq4ojqgZFQczTYlGjzONGTDAcLremjwaWv5A+EDLnxhQzY5xUZPWLOLqYRkY0Cbw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <h1 id="titulo">
      <i class="fa-solid fa-dollar-sign" style="color: #74c0fc"></i> Calculadora
      de divisas <i class="fa-solid fa-dollar-sign" style="color: #74c0fc"></i>
    </h1>
    <hr id="line" />
    <section class="container">
      <h3>Ingrese la cantidad de pesos chilenos (CLP) a convertir</h3>
      <input type="number" id="monto" placeholder="Monto en CLP" />
      <h3>Seleccione la divisa</h3>
      <select id="divisa">
        <!-- Se rellenará automaticamente cuando se lea y parsee el archivo JSON -->
      </select>
      <button id="convertir" class="btn btn-primary">Convertir</button>
      <button id="reset" class="btn btn-danger">Limpiar</button>
      <button id="graficar" class="btn btn-secondary">Graficar</button>
      <div id="resultado" class="mt-4">
        <h3>Resultado de la conversión (hacer dinámico)</h3>
        <p id="resultado">
          <!-- Aquí se mostrará el resultado de la conversión -->
        </p>
        
      </div>
      <div id="graficoContainer" class="mt-4">
        <canvas id="graficoDivisa"></canvas>
      </div>
    </section>
    <script src="assets/js/script.js"></script>
  </body>
</html>
